services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - artizen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # This compose file is the LOCAL DEVELOPMENT setup, and this line is
    # what makes it one: --reload watches the bind-mounted source below.
    # The image's own CMD is the production server (no --reload, several
    # workers) — deploying the image without this override is what you
    # want, and is now the default rather than something to remember.
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      # Always reach the database via the compose network, regardless of
      # what POSTGRES_HOST is set to for local (non-docker) development.
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - artizen_storage_data:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The async task worker (arq). Same image as the backend, different command:
  # it runs queued jobs (STT/LLM/OCR/email/mass PDF in V3) off the request
  # path. Scales horizontally by raising the replica count.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - artizen_storage_data:/data/storage

volumes:
  artizen_postgres_data:
  # NOTE — the backend container now runs as the non-root "artizen" user.
  # Docker copies the image's ownership of /data/storage onto this volume
  # only when it initializes it EMPTY. A volume created before that change
  # is still root-owned, and uploads will fail with EACCES. On an existing
  # install, either `docker compose down -v` (destroys stored files) or
  # chown it once:
  #   docker compose run --rm --user root backend chown -R artizen /data/storage
  artizen_storage_data:
