name: artizen
description: "Artizen — copilote des artisans (client Flutter)."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Path-based URL strategy for the web (deep links like the reset-password
  # email link) — see main.dart. Ships with the Flutter SDK.
  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # HTTP client + logging
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Models: immutable data classes + JSON (de)serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Token storage (JWT, once real auth lands)
  flutter_secure_storage: ^9.2.2

  # Currency/number formatting for HT/TVA/TTC display
  intl: ^0.19.0

  # Cross-platform (incl. web) file picking — Étape 8, template import
  file_picker: ^8.1.6
  # MediaType for multipart PDF uploads (already a transitive dio dependency,
  # declared explicitly since we import it directly).
  http_parser: ^4.1.2
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  # Mocking for repository/provider tests
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    # Exo 2 — the geometric, technical, modern app font (ENR-inspired).
    # Variable font: Flutter applies fontWeight along the weight axis.
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2.ttf
    # Orbitron — the ARTIZEN brand wordmark (display only).
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron.ttf
