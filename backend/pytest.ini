[pytest]
asyncio_mode = auto
# function-scoped, matching the (unconfigurable) default loop scope of the
# test functions themselves. A wider fixture scope (e.g. "session") would
# make DB-touching fixtures run on a different loop than the test body
# that uses them, breaking the shared async engine mid-test ("attached to
# a different loop"). Cross-test pool staleness is handled separately by
# the `_dispose_engine_after_test` autouse fixture in conftest.py.
asyncio_default_fixture_loop_scope = function
testpaths = app/tests
